[project]
name = "markword"
version = "0.4.0"
description = "FastAPI-powered text counter and Markdown editor"
readme = "README.md"
license = "LicenseRef-Proprietary"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "markdown>=3.5",
    "markdown-it-py>=3.0.0",
    "weasyprint>=68.0",
    "playwright>=1.51.0",
    "python-docx>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "pygments>=2.17.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]
